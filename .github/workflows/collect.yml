name: Collect public news
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-brief-cloud-sync
  cancel-in-progress: false
jobs:
  collect:
    if: vars.CLOUD_BASE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: news_web/requirements.txt
      - name: Install collector dependencies
        run: pip install -r news_web/requirements.txt
      - name: Collect and sync changed news
        env:
          CLOUD_BASE_URL: ${{ vars.CLOUD_BASE_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: python -u -m scripts.cloud_sync --ai-limit 2
